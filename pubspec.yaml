name: dual_screen_hinge
description: "iPhone Duo-first foldable support for Flutter: hinge angles, postures, reserved regions, screen roles, and Android display modes."
version: 0.2.0
homepage: https://code-growers.github.io/dual_screen_hinge/
repository: https://github.com/Code-Growers/dual_screen_hinge
issue_tracker: https://github.com/Code-Growers/dual_screen_hinge/issues
documentation: https://code-growers.github.io/dual_screen_hinge/
topics:
  - iphone-duo
  - foldable
  - dual-screen
  - hinge
  - android
screenshots:
  - description: iPhone Duo reserved-region geometry visualized in the Flutter example.
    path: assets/screenshots/iphone_duo_reserved_regions.png

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_plugin_android_lifecycle: ^2.0.35
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.codegrowers.dual_screen_hinge
        pluginClass: DualScreenHingePlugin
      ios:
        pluginClass: DualScreenHingePlugin
