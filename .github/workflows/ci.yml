name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
      - run: flutter analyze
      - run: flutter test
      - run: flutter test
        working-directory: example
      - run: ./gradlew :dual_screen_hinge:testDebugUnitTest :app:assembleDebug
        working-directory: example/android
      - run: dart doc
      - run: flutter pub publish --dry-run
      - run: dart pub global activate pana
      - run: dart pub global run pana --no-warning

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - name: CocoaPods build
        run: |
          flutter config --no-enable-swift-package-manager
          flutter build ios --simulator --no-codesign
        working-directory: example
      - name: Swift Package manifest validation
        run: |
          swift package dump-package
        working-directory: ios/dual_screen_hinge

  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: dart pub get
      - run: dart analyze
      - run: dart test
      - run: dart pub global activate jaspr_cli 0.23.4
      - run: jaspr build
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
